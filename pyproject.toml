[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "griffinai-showcase"
version = "0.1.0"
description = "Sanitized reference implementation of an AI content workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Deryugin" }]

[tool.setuptools.packages.find]
where = ["src"]

